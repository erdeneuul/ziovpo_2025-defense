spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/ziovpo_db}
    username: ${DB_USERNAME:ziovpo}
    password: ${DB_PASSWORD}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: always
      separator: ^^^

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: ${TLS_KEY_ALIAS:server}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

signature:
  key-store-path: ${SIGNATURE_KEYSTORE_PATH:classpath:keystore.p12}
  key-store-type: PKCS12
  key-store-password: ${SIGNATURE_KEYSTORE_PASSWORD}
  key-alias: ${SIGNATURE_KEY_ALIAS:server}
  key-password: ${SIGNATURE_KEY_PASSWORD}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:av-signature}

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
